name: CI
# The distribution ships no modules — this checks that the metadata-only
# wheel still builds and that its one dependency resolves. There is nothing
# left to test: the modules, their generators and their guards moved to
# openccu-loom-client (its #122).
# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository_owner == 'SukramJ'
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build the wheel
        run: |
          pip install --upgrade build
          python -m build

      - name: Assert it ships no modules
        run: |
          set -euo pipefail
          WHEEL="$(ls dist/*.whl)"
          echo "inspecting $WHEEL"
          if python -c "
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          leaked = [n for n in names if not n.split('/')[0].endswith('.dist-info')]
          print('\\n'.join(names))
          sys.exit(1 if leaked else 0)
          " "$WHEEL"; then
            echo "metadata-only wheel confirmed"
          else
            echo "::error::the wheel ships files outside .dist-info — this release must stay metadata-only, or an environment holding it would shadow openccu_loom_client/wire/"
            exit 1
          fi
