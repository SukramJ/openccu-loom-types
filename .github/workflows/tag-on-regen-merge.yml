name: "Release: Tag on regen merge"
# When an automated regeneration PR (branch regen/daemon-*) is merged into
# main, read the bumped VERSION from const.py and push the matching v<version>
# tag. That tag push triggers release-on-tag.yml, which creates the GitHub
# Release and dispatches the PyPI publish — closing the loop end to end.
#
# The tag MUST be pushed with a PAT (secrets.RELEASE_PAT), not GITHUB_TOKEN:
# a tag pushed by GITHUB_TOKEN does not trigger release-on-tag.yml (GitHub's
# recursive-workflow guard).
# yamllint disable-line rule:truthy
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  tag:
    # Paused deliberately, not broken: the job runs only when the repository
    # variable AUTO_TAG_REGEN is set to 'true', and it is unset.
    #
    # Why: 103 of 404 releases across the openccu-loom chain originate here,
    # and this repository changes no hand-written line in 98 of 104 version
    # bumps. 54 of its 106 publications never reached a pin in any consumer.
    # The cause is this job — every merged regeneration PR tags, and the tag
    # publishes to PyPI, so nobody ever decides to release. Regeneration PRs
    # are still opened and merged; only the tag now waits for a human who
    # wants that version adopted.
    #
    # This is a measurement with a deadline. After four weeks, compare the
    # release count against the preceding period. The expectation from the
    # history is roughly half. If the number does not move, the churn was not
    # this automation, and the case for folding this package into
    # openccu-loom-client (SukramJ/openccu-loom-client#122) has to be rebuilt
    # on something else before it is acted on.
    #
    # Re-enable by setting the variable — no code change, no review.
    if: >
      github.repository_owner == 'SukramJ'
      && vars.AUTO_TAG_REGEN == 'true'
      && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'regen/daemon-')
    name: Tag merged regeneration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Read version and push tag
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^VERSION: Final = "([^"]+)"$/\1/p' openccu_loom_types/const.py)"
          if [ -z "$VERSION" ]; then
            echo "VERSION constant not found in const.py" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists — nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "Pushed ${TAG}"
