[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openccu-loom-types"
version = "0.6.1"
description = "Retired — the generated types now ship inside openccu-loom-client"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "OpenCCU-Loom authors" }]
requires-python = ">=3.14"
# This release ships no modules. It exists so an environment that still has
# openccu-loom-types installed — Home Assistant never uninstalls an abandoned
# requirement — can be upgraded onto the package that actually holds the
# bindings instead of keeping a stale copy of them.
dependencies = [
    "openccu-loom-client>=2026.8.33",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/SukramJ/openccu-loom-types"
"Bug Tracker" = "https://github.com/SukramJ/openccu-loom-types/issues"
"Source Repo" = "https://github.com/SukramJ/openccu-loom"

# No packages: this distribution is metadata only.
[tool.setuptools]
packages = []
